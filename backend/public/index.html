<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniGPT HF</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="brand">🤗</div>
      <h1>MiniGPT HF</h1>
      <p>Chat educativo conectado a Hugging Face mediante un backend Node.js.</p>
      <label for="model">Modelo IA</label>

<select id="model">
    <option value="meta-llama/Llama-3.1-8B-Instruct">Llama 3.1 8B</option>
    <option value="mistralai/Mistral-7B-Instruct-v0.3">Mistral 7B</option>
    <option value="Qwen/Qwen3-8B">Qwen3 8B</option>
    <option value="deepseek-ai/DeepSeek-R1">DeepSeek R1</option>
    <option value="google/gemma-3-12b-it">Gemma 3 12B</option>
    <option value="microsoft/Phi-4">Phi 4</option>
    <option value="TinyLlama/TinyLlama-1.1B-Chat-v1.0">TinyLlama</option>
</select>
      </select>
      <button id="clearBtn">Limpiar chat</button>
    </section>

    <section class="chat">
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="composer">
        <textarea id="prompt" placeholder="Escribe tu pregunta..." rows="2"></textarea>
        <button type="submit">Enviar</button>
      </form>
    </section>


  </main>
  <script src="app.js"></script>
</body>
</html>
